<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>An Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     EDIT TEXT & LINK FURTHER DOWN: search "EDIT HEADING",
     "EDIT MESSAGE BODY", "EDIT THE LINK"
     ============================================================ */

  :root {
    /* Limited 16-color palette for cohesion */
    --c-black:    #1a0e08;
    --c-shadow:   #2a160c;
    --c-brown-d:  #4a2611;
    --c-brown:    #6b3a1c;
    --c-brown-l:  #8a5028;
    --c-brown-ll: #a8632e;
    --c-amber-d:  #c9802e;
    --c-amber:    #ffb347;
    --c-amber-l:  #ffd27a;
    --c-cream:    #f3e3c3;
    --c-cream-d:  #d9c294;
    --c-cream-w:  #fff5d6;
    --c-red-d:    #7a1f15;
    --c-red:      #c0392b;
    --c-red-l:    #e85a4a;
    --c-sky-d:    #3a2820;
    --c-sky:      #5a4030;
    --c-sky-l:    #7a5840;
    --c-ink:      #3a1f0e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--c-black);
    font-family: 'VT323', monospace;
    /* CRITICAL: force all images and SVG to render with sharp pixels */
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
  }

  svg {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    shape-rendering: crispEdges;
  }

  body {
    position: relative;
    background: var(--c-sky);
  }

  /* ============================================================
     PIXEL-DITHERED SKY using stepped color blocks + dot pattern
     ============================================================ */
  .sky-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      /* dot dither pattern overlay */
      radial-gradient(circle at 2px 2px, rgba(0,0,0,0.15) 1px, transparent 1px) 0 0 / 4px 4px,
      /* stepped horizontal bands using hard-stop gradient = no smoothing */
      linear-gradient(
        180deg,
        var(--c-sky-d)  0%,    var(--c-sky-d)  20%,
        var(--c-sky)    20%,   var(--c-sky)    45%,
        var(--c-sky-l)  45%,   var(--c-sky-l)  60%,
        var(--c-brown)  60%,   var(--c-brown)  100%
      );
  }

  /* secondary dither overlay between bands for smoother transition */
  .sky-dither {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image:
      repeating-conic-gradient(
        var(--c-sky-d) 0% 25%,
        transparent 25% 50%,
        var(--c-sky) 50% 75%,
        transparent 75% 100%
      );
    background-size: 8px 8px;
    background-position: 0 18%;
    background-repeat: no-repeat;
    opacity: 0.4;
    height: 8%;
    top: 17%;
  }

  /* ============================================================
     SCENE WRAPPER — everything scales together
     ============================================================ */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 5;
  }

  /* All SVG sprites use viewBox in real pixel units (e.g. 64x64)
     and are scaled up by CSS — that's what gives the stair-step
     look. They're never resized smoothly. */

  .sprite {
    position: fixed;
    pointer-events: none;
    transition: opacity 0.6s ease, filter 0.6s ease;
  }

  /* When letter opens, dim & desaturate background props so the letter pops */
  body.letter-open .sprite,
  body.letter-open .buildings,
  body.letter-open .rain,
  body.letter-open .light-pool {
    opacity: 0.35;
    filter: brightness(0.6);
  }
  body.letter-open .desk,
  body.letter-open .desk-edge,
  body.letter-open .sky-bg,
  body.letter-open .sky-dither {
    filter: brightness(0.5);
    transition: filter 0.6s ease;
  }

  /* Vignette overlay that appears under the letter to push focus center */
  .focus-vignette {
    position: fixed;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    background: radial-gradient(
      ellipse 50% 60% at 50% 50%,
      transparent 0%,
      transparent 30%,
      rgba(0,0,0,0.4) 60%,
      rgba(0,0,0,0.75) 100%
    );
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  body.letter-open .focus-vignette { opacity: 1; }

  /* Cloud sprites */
  .cloud-a { top: 8%;  left: 5%;  width: 200px; animation: drift-a 80s linear infinite; }
  .cloud-b { top: 5%;  left: 60%; width: 160px; animation: drift-b 100s linear infinite; opacity: 0.85; }
  .cloud-c { top: 22%; left: 30%; width: 240px; animation: drift-c 130s linear infinite; opacity: 0.7; }

  @keyframes drift-a { from { transform: translateX(-300px); } to { transform: translateX(100vw); } }
  @keyframes drift-b { from { transform: translateX(-300px); } to { transform: translateX(100vw); } }
  @keyframes drift-c { from { transform: translateX(-300px); } to { transform: translateX(100vw); } }

  /* Distant buildings */
  .buildings {
    position: fixed;
    bottom: 45%;
    left: 0;
    right: 0;
    height: 100px;
    z-index: 3;
    pointer-events: none;
  }
  .buildings svg { width: 100%; height: 100%; display: block; }

  /* ============================================================
     RAIN — individual pixel raindrops
     ============================================================ */
  .rain {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
  }

  .raindrop {
    position: absolute;
    width: 3px;
    background: var(--c-cream);
    top: -20px;
    opacity: 0.45;
    animation: fall linear infinite;
    /* break drop into segments using box-shadow for chunky pixel look */
    box-shadow: 0 -6px 0 var(--c-cream-d);
  }

  @keyframes fall {
    0%   { transform: translateY(-20px); opacity: 0; }
    10%  { opacity: 0.55; }
    90%  { opacity: 0.55; }
    100% { transform: translateY(105vh); opacity: 0; }
  }

  /* ============================================================
     DESK — built from 8px tile pattern, not a smooth gradient
     ============================================================ */
  .desk {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 45%;
    z-index: 5;
    pointer-events: none;
    background:
      /* grain knots & speckles */
      radial-gradient(circle at 16px 24px, var(--c-brown-d) 2px, transparent 2px) 0 0 / 64px 32px,
      radial-gradient(circle at 48px 8px,  var(--c-brown-d) 2px, transparent 2px) 0 0 / 96px 48px,
      radial-gradient(circle at 4px 12px,  var(--c-brown-l) 2px, transparent 2px) 0 0 / 80px 40px,
      /* horizontal plank lines */
      repeating-linear-gradient(
        180deg,
        var(--c-brown)   0px,   var(--c-brown)   24px,
        var(--c-brown-d) 24px,  var(--c-brown-d) 26px,
        var(--c-brown-l) 26px,  var(--c-brown-l) 28px,
        var(--c-brown)   28px,  var(--c-brown)   56px,
        var(--c-brown-d) 56px,  var(--c-brown-d) 58px
      );
  }

  /* Top edge of desk (stair-step pixel ridge) */
  .desk-edge {
    position: fixed;
    bottom: 45%;
    left: 0;
    right: 0;
    height: 8px;
    z-index: 6;
    pointer-events: none;
    background:
      linear-gradient(180deg,
        var(--c-brown-l) 0px,   var(--c-brown-l) 2px,
        var(--c-amber-d) 2px,   var(--c-amber-d) 4px,
        var(--c-brown-l) 4px,   var(--c-brown-l) 6px,
        var(--c-brown-d) 6px,   var(--c-brown-d) 8px
      );
  }

  /* Light pool from candle, rendered as discrete radial steps not a smooth gradient */
  .light-pool {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: 45%;
    z-index: 6;
    pointer-events: none;
    background: radial-gradient(
      ellipse 60% 100% at 50% 30%,
      rgba(255, 179, 71, 0.30) 0%,
      rgba(255, 179, 71, 0.30) 30%,
      rgba(255, 179, 71, 0.18) 30%,
      rgba(255, 179, 71, 0.18) 55%,
      rgba(255, 179, 71, 0.08) 55%,
      rgba(255, 179, 71, 0.08) 80%,
      transparent 80%
    );
    animation: lightFlicker 3s steps(2, end) infinite;
    mix-blend-mode: screen;
  }

  @keyframes lightFlicker {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1; }
  }

  /* ============================================================
     PIXEL SPRITES — all positioned relative to center
     ============================================================ */
  .candle-sprite {
    bottom: 38%;
    left: calc(50% - 240px);
    width: 64px;
    height: 96px;
    z-index: 8;
  }
  .candle-sprite svg { width: 100%; height: 100%; display: block; }
  .flame-flicker { animation: flameFlicker 0.3s steps(2, end) infinite; transform-origin: center bottom; }
  @keyframes flameFlicker {
    0%   { transform: scale(1, 1); }
    50%  { transform: scale(0.92, 1.06); }
    100% { transform: scale(1.04, 0.96); }
  }

  .books-sprite {
    bottom: 38%;
    right: calc(50% - 320px);
    width: 120px;
    height: 130px;
    z-index: 7;
  }
  .books-sprite svg { width: 100%; height: 100%; display: block; }
  .steam-puff { animation: steamRise 3s steps(6, end) infinite; }
  .steam-puff-2 { animation: steamRise 3s steps(6, end) infinite; animation-delay: -1.5s; }
  @keyframes steamRise {
    0%   { transform: translate(0, 0)    scale(1);   opacity: 0; }
    30%  { opacity: 0.7; }
    100% { transform: translate(2px, -30px) scale(1.5); opacity: 0; }
  }

  .ink-sprite {
    bottom: 38%;
    right: calc(50% - 220px);
    width: 56px;
    height: 80px;
    z-index: 8;
  }
  .ink-sprite svg { width: 100%; height: 100%; display: block; }

  .crumple-sprite {
    bottom: 36%;
    left: calc(50% - 140px);
    width: 40px;
    height: 36px;
    z-index: 8;
  }
  .crumple-sprite svg { width: 100%; height: 100%; display: block; }

  /* small ink splat */
  .splat-sprite {
    bottom: 37%;
    left: calc(50% + 180px);
    width: 28px;
    height: 20px;
    z-index: 7;
  }
  .splat-sprite svg { width: 100%; height: 100%; display: block; }

  /* ============================================================
     ENVELOPE — pure SVG pixel art
     ============================================================ */
  .stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
    z-index: 10;
  }

  .envelope-wrap {
    position: relative;
    width: 320px;
    height: 220px;
    margin-top: -8%;
    cursor: pointer;
    animation: float 4s steps(8, end) infinite;
    transition: transform 0.4s ease, opacity 0.6s ease;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .envelope-wrap:hover { transform: translateY(-4px) scale(1.02); }

  /* glow halo — also stepped, not smooth */
  .envelope-wrap::before {
    content: '';
    position: absolute;
    inset: -60px;
    background: radial-gradient(
      ellipse at center,
      rgba(255, 179, 71, 0.5)  0%,
      rgba(255, 179, 71, 0.5)  20%,
      rgba(255, 179, 71, 0.3)  20%,
      rgba(255, 179, 71, 0.3)  40%,
      rgba(255, 179, 71, 0.12) 40%,
      rgba(255, 179, 71, 0.12) 65%,
      transparent 65%
    );
    pointer-events: none;
    animation: pulse 2.4s steps(4, end) infinite;
    z-index: -1;
    mix-blend-mode: screen;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.08); }
  }

  .envelope-wrap::after {
    content: '';
    position: absolute;
    bottom: -16px;
    left: 12%;
    right: 12%;
    height: 8px;
    background: rgba(0,0,0,0.5);
    z-index: -2;
    /* pixelated shadow not soft */
    clip-path: polygon(8% 0, 92% 0, 96% 50%, 92% 100%, 8% 100%, 4% 50%);
  }

  .envelope-svg, .letter-svg-bg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .env-flap-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 60%;
    transform-origin: top center;
    transition: transform 0.7s cubic-bezier(0.5, 0, 0.5, 1);
    z-index: 3;
  }

  .env-seal-svg {
    position: absolute;
    top: 32%;
    left: 50%;
    transform: translate(-50%, 0);
    width: 56px;
    height: 56px;
    z-index: 4;
    transition: opacity 0.25s ease, transform 0.35s ease;
  }

  /* OPENING STATES */
  .envelope-wrap.opening { cursor: default; animation: none; }
  .envelope-wrap.opening .env-flap-svg { transform: rotateX(-180deg); }
  .envelope-wrap.opening .env-seal-svg {
    opacity: 0;
    transform: translate(-50%, 0) scale(0.2);
  }
  .envelope-wrap.opened {
    animation: envelopeShrink 0.8s steps(8, end) forwards;
    animation-delay: 0.6s;
  }
  @keyframes envelopeShrink {
    0%   { transform: translateY(0)    scale(1);   opacity: 1; }
    100% { transform: translateY(60px) scale(0.4); opacity: 0; }
  }
  .envelope-wrap.opened::before {
    animation: glowFade 0.8s steps(4, end) forwards;
    animation-delay: 0.6s;
  }
  @keyframes glowFade { to { opacity: 0; } }
  .envelope-wrap.opening .hint { opacity: 0; transition: opacity 0.3s ease; }

  /* Hint text */
  .hint {
    position: absolute;
    bottom: -68px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--c-amber-l);
    letter-spacing: 2px;
    text-shadow:
      2px 0 0 var(--c-black),
      -2px 0 0 var(--c-black),
      0 2px 0 var(--c-black),
      0 -2px 0 var(--c-black),
      0 0 8px rgba(255, 179, 71, 0.8);
    white-space: nowrap;
    animation: hintBlink 1.4s steps(2, end) infinite;
  }

  @keyframes hintBlink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0.4; }
  }

  /* ============================================================
     LETTER
     ============================================================ */
  .letter {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(540px, 92vw);
    max-height: 86vh;
    transform: translate(-50%, 30%) scale(0.4);
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    background: transparent;
  }

  .letter.showing {
    animation: letterRise 1.2s steps(12, end) forwards;
    animation-delay: 0.9s;
    pointer-events: auto;
  }

  @keyframes letterRise {
    0%   { transform: translate(-50%, 30%)  scale(0.4); opacity: 0; }
    40%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
  }

  /* The paper background is an SVG with stair-step pixel edges */
  .letter-paper {
    position: relative;
    width: 100%;
    /* paper border drawn entirely with box-shadows = pixel-perfect */
    background: var(--c-cream);
    /* layered shadows = stepped pixel border, no smooth blur */
    box-shadow:
      /* outer dark frame */
      0  -4px 0 var(--c-cream-d),
      0   4px 0 var(--c-cream-d),
     -4px  0  0 var(--c-cream-d),
      4px  0  0 var(--c-cream-d),
      /* second frame layer */
     -4px -4px 0 var(--c-cream-d),
      4px -4px 0 var(--c-cream-d),
     -4px  4px 0 var(--c-cream-d),
      4px  4px 0 var(--c-cream-d),
      /* outer black border */
      0  -8px 0 var(--c-black),
      0   8px 0 var(--c-black),
     -8px  0  0 var(--c-black),
      8px  0  0 var(--c-black),
     -8px -8px 0 var(--c-black),
      8px -8px 0 var(--c-black),
     -8px  8px 0 var(--c-black),
      8px  8px 0 var(--c-black),
      /* drop shadow chunky */
      0 16px 0 rgba(0,0,0,0.5),
      /* glow */
      0 0 80px rgba(255, 179, 71, 0.4);
    padding: 48px 44px 40px;
    overflow-y: auto;
    max-height: 86vh;
    /* horizontal rule grid lines */
    background-image:
      repeating-linear-gradient(
        180deg,
        transparent 0,
        transparent 27px,
        rgba(107, 58, 28, 0.12) 27px,
        rgba(107, 58, 28, 0.12) 28px
      );
  }

  /* Torn pixel top edge — stair-step polygon */
  .letter-paper::before {
    content: '';
    position: absolute;
    top: -8px;
    left: -8px;
    right: -8px;
    height: 12px;
    background: var(--c-cream);
    box-shadow:
      0 -4px 0 var(--c-cream-d),
      0 -8px 0 var(--c-black);
    /* stair-step zigzag */
    clip-path: polygon(
      0% 100%,
      4% 100%, 4% 25%, 8% 25%, 8% 75%, 12% 75%, 12% 0%,
      16% 0%, 16% 50%, 20% 50%, 20% 25%, 24% 25%, 24% 100%,
      28% 100%, 28% 50%, 32% 50%, 32% 0%, 36% 0%, 36% 75%,
      40% 75%, 40% 25%, 44% 25%, 44% 50%, 48% 50%, 48% 0%,
      52% 0%, 52% 50%, 56% 50%, 56% 25%, 60% 25%, 60% 100%,
      64% 100%, 64% 75%, 68% 75%, 68% 0%, 72% 0%, 72% 50%,
      76% 50%, 76% 25%, 80% 25%, 80% 75%, 84% 75%, 84% 0%,
      88% 0%, 88% 50%, 92% 50%, 92% 25%, 96% 25%, 96% 100%,
      100% 100%
    );
  }

  .letter-seal-mark {
    position: absolute;
    top: -16px;
    right: 24px;
    width: 48px;
    height: 48px;
    z-index: 5;
  }
  .letter-seal-mark svg { width: 100%; height: 100%; display: block; }

  .letter-content { position: relative; z-index: 2; }

  .letter-heading {
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    color: var(--c-brown-d);
    text-align: center;
    margin-bottom: 28px;
    letter-spacing: 1px;
    line-height: 1.6;
  }

  .letter-body {
    font-family: 'VT323', monospace;
    font-size: 26px;
    color: var(--c-ink);
    line-height: 1.5;
    margin-bottom: 32px;
    white-space: pre-line;
  }

  /* Pixel divider — chunky blocks instead of smooth gradient */
  .letter-divider {
    width: 80%;
    height: 8px;
    margin: 0 auto 28px;
    position: relative;
    background:
      linear-gradient(90deg,
        transparent 0%,    transparent 8%,
        var(--c-brown) 8%, var(--c-brown) 12%,
        transparent 12%,   transparent 20%,
        var(--c-brown) 20%, var(--c-brown) 80%,
        transparent 80%,   transparent 88%,
        var(--c-brown) 88%, var(--c-brown) 92%,
        transparent 92%
      );
    box-shadow:
      0 4px 0 var(--c-brown-d);
  }
  .letter-divider::before,
  .letter-divider::after {
    content: '✦';
    position: absolute;
    top: -4px;
    font-size: 16px;
    color: var(--c-brown-d);
    background: var(--c-cream);
    padding: 0 6px;
  }
  .letter-divider::before { left: 33%; }
  .letter-divider::after  { right: 33%; }

  .invite-link-wrap { text-align: center; margin-top: 12px; }
  .invite-prefix {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--c-brown);
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  /* Pixel button using ONLY chunky box-shadows */
  .invite-link {
    display: inline-block;
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    color: var(--c-amber);
    text-decoration: none;
    padding: 14px 24px;
    letter-spacing: 2px;
    background: var(--c-black);
    position: relative;
    /* stepped pixel border, no smoothing */
    box-shadow:
      0   -4px 0 var(--c-amber),
      0    4px 0 var(--c-amber-d),
     -4px  0   0 var(--c-amber),
      4px  0   0 var(--c-amber),
     -4px -4px 0 var(--c-amber),
      4px -4px 0 var(--c-amber),
     -4px  4px 0 var(--c-amber-d),
      4px  4px 0 var(--c-amber-d),
      0    8px 0 var(--c-black),
     -8px  0   0 var(--c-black),
      8px  0   0 var(--c-black),
      0   -8px 0 var(--c-black),
     -8px -8px 0 var(--c-black),
      8px -8px 0 var(--c-black),
     -8px  8px 0 var(--c-black),
      8px  8px 0 var(--c-black),
      0 0 20px rgba(255, 179, 71, 0.5),
      0 0 40px rgba(255, 179, 71, 0.3);
    text-shadow:
      2px 0 0 var(--c-brown-d),
      0 2px 0 var(--c-brown-d),
      0 0 6px var(--c-amber),
      0 0 12px var(--c-amber);
    animation: linkPulse 1.6s steps(2, end) infinite;
    transition: transform 0.12s steps(2, end);
  }

  @keyframes linkPulse {
    0%, 49%   { color: var(--c-amber);   filter: brightness(1); }
    50%, 100% { color: var(--c-amber-l); filter: brightness(1.2); }
  }

  .invite-link:hover  { transform: translateY(-2px); }
  .invite-link:active { transform: translateY(2px); }

  /* Mobile */
  @media (max-width: 600px) {
    .envelope-wrap { width: 240px; height: 165px; }
    .candle-sprite { left: 12px;  bottom: 36%; width: 48px; height: 72px; }
    .ink-sprite    { right: 12px; bottom: 36%; width: 42px; height: 60px; }
    .books-sprite, .crumple-sprite, .splat-sprite { display: none; }
    .letter-paper { padding: 36px 22px 28px; }
    .letter-heading { font-size: 13px; }

<script>
  /* Generate raindrops */
  const rainContainer = document.getElementById('rain');
  for (let i = 0; i < 60; i++) {
    const drop = document.createElement('div');
    drop.className = 'raindrop';
    drop.style.left = Math.random() * 100 + 'vw';
    drop.style.animationDuration = (0.5 + Math.random() * 0.7) + 's';
    drop.style.animationDelay = (Math.random() * 2) + 's';
    drop.style.height = (6 + Math.floor(Math.random() * 4) * 3) + 'px';
    rainContainer.appendChild(drop);
  }

  /* Envelope open */
  const envelope = document.getElementById('envelope');
  const letter   = document.getElementById('letter');
  let opened = false;

  function openEnvelope() {
    if (opened) return;
    opened = true;
    envelope.classList.add('opening');
    setTimeout(() => envelope.classList.add('opened'), 700);
    setTimeout(() => {
      letter.classList.add('showing');
      document.body.classList.add('letter-open');
    }, 600);
  }

  envelope.addEventListener('click', openEnvelope);
  envelope.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openEnvelope();
    }
  });
</script>
